<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation Exercise</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 id="main-heading">DOM Manipulation Demo</h1>
    </header>
    
    <main>
        <section class="content-section">
            <p id="dynamic-text">This text will change when you click the button below.</p>
            <button id="change-text-btn" class="action-btn">Change Text</button>
        </section>
        
        <section class="content-section">
            <div id="style-demo" class="demo-box">
                <p>This box's style will change when you click the button.</p>
            </div>
            <button id="change-style-btn" class="action-btn">Change Style</button>
        </section>
        
        <section class="content-section">
            <div id="element-container">
                <p>Click the button to add or remove elements.</p>
            </div>
            <div class="button-group">
                <button id="add-element-btn" class="action-btn">Add Element</button>
                <button id="remove-element-btn" class="action-btn">Remove Element</button>
            </div>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2023 DOM Manipulation Practice</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
